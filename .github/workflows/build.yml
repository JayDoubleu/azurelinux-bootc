name: build

on:
  push:
    branches: [main]
    paths-ignore: &docs
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'
      - '.github/dependabot.yml'
      - '.github/workflows/lint.yml'
  pull_request:
    paths-ignore: *docs
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  # A newer push cancels the older run of the same branch; only the newest commit matters.
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned: the firmware paths below are Ubuntu 24.04 paths.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            suffix: ""
            # The x86_64 runners have /dev/kvm, so the QEMU loop runs here.
            test: true
          - arch: aarch64
            runner: ubuntu-24.04-arm
            suffix: -arm64
            # Native arm64 runner, free for public repositories. No KVM there, so no boot test yet;
            # an install probe below shows whether bootc install works natively.
            test: false
    env:
      ARCH: ${{ matrix.arch }}
      # Ubuntu paths from the ovmf package. scripts/lib.sh defaults to the Fedora paths.
      OVMF_CODE: /usr/share/OVMF/OVMF_CODE_4M.fd
      OVMF_VARS_SRC: /usr/share/OVMF/OVMF_VARS_4M.fd
      # IMAGE_TAG and REGISTRY_FROM_HOST stay unset here. The test loop uses the defaults,
      # dev and localhost:5000. The ghcr.io push step sets its own.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Registry path and tags for ghcr.io
        # ghcr.io wants the owner in lowercase. Tags: latest, vRUN and YYYYMMDD, with -arm64 for aarch64.
        run: |
          echo "GHCR=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "EXTRA_TAGS=v${GITHUB_RUN_NUMBER}${{ matrix.suffix }} $(date -u +%Y%m%d)${{ matrix.suffix }}" >> "$GITHUB_ENV"

      - name: Install podman, skopeo, QEMU and OVMF
        run: |
          sudo apt-get update
          if [ "${{ matrix.arch }}" = x86_64 ]; then
            sudo apt-get install -y podman skopeo slirp4netns qemu-system-x86 qemu-utils ovmf
            qemu-system-x86_64 --version | head -n 1
          else
            sudo apt-get install -y podman skopeo slirp4netns qemu-utils
            ls -l /dev/kvm 2>/dev/null || echo 'no /dev/kvm on this runner'
          fi
          podman --version
          skopeo --version

      - name: Allow unprivileged user namespaces
        # Ubuntu 24.04 lets only binaries with an AppArmor profile create user namespaces.
        # podman has one, skopeo does not, and skopeo needs one to write the rootless image store.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Signing key
        # With the three secrets set, every build signs with the same key and the public key in
        # the image matches. Without them the run makes a throwaway key, so the image is signed
        # but no machine can verify it against a known key. Fork pull requests get no secrets.
        env:
          SIGSTORE_PRIVATE_KEY: ${{ secrets.SIGSTORE_PRIVATE_KEY }}
          SIGSTORE_PASSPHRASE: ${{ secrets.SIGSTORE_PASSPHRASE }}
          SIGSTORE_PUBLIC_KEY: ${{ secrets.SIGSTORE_PUBLIC_KEY }}
        run: |
          if [ -n "$SIGSTORE_PRIVATE_KEY" ]; then
            mkdir -p out/keys config/etc/pki/containers
            umask 077
            printf '%s\n' "$SIGSTORE_PRIVATE_KEY" > out/keys/azurelinux-bootc.private
            printf '%s' "$SIGSTORE_PASSPHRASE" > out/keys/passphrase
            umask 022
            printf '%s\n' "$SIGSTORE_PUBLIC_KEY" > config/etc/pki/containers/azurelinux-bootc.pub
            echo "using the signing key from secrets"
          else
            make keys
            echo "using a throwaway signing key"
          fi

      - name: Check tools
        if: matrix.test
        run: make check

      - name: Build and chunk
        run: make build VERSION=${{ github.run_number }}

      - name: Keep the tested image for the ghcr.io push
        # make upgrade moves the dev tag to the next version. This tag keeps the tested one.
        run: podman tag "localhost/azurelinux-bootc:dev${{ matrix.suffix }}" "localhost/azurelinux-bootc:latest${{ matrix.suffix }}"

      - name: Free disk space
        # The loop needs about 10 GB: two images in the store, the OCI directory and the disk.
        if: matrix.test
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Open /dev/kvm to the runner user
        # The device is root:kvm 0660 and the runner user is not in the kvm group.
        if: matrix.test
        run: |
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          sudo podman info --format 'root store: {{.Store.GraphDriverName}} {{.Store.GraphOptions}}'

      - name: Rootless podman probe
        # Confirms that rootless containers still start after the two steps above.
        if: matrix.test
        run: |
          podman unshare cat /proc/self/uid_map
          podman info --format '{{.Host.OCIRuntime.Name}} {{.Host.OCIRuntime.Version}}'
          podman run --rm localhost/azurelinux-bootc:dev true && echo 'container start ok'

      - name: Install probe on arm64
        # Answers whether bootc install to-disk works natively on this runner. Informational.
        if: matrix.arch == 'aarch64'
        continue-on-error: true
        run: |
          make registry
          make push
          make disk
          ls -la --block-size=M out/

      - name: Local registry and signed push
        if: matrix.test
        run: |
          make registry
          make push

      - name: Install to disk
        # The script re-runs itself with sudo. The runner has passwordless sudo.
        if: matrix.test
        run: make disk

      - name: Boot and check
        if: matrix.test
        run: |
          make run-bg
          make wait
          scripts/45-ssh.sh bootc status
          test "$(scripts/45-ssh.sh getenforce)" = Enforcing
          test "$(scripts/45-ssh.sh cat /usr/lib/azurelinux-bootc/version)" = "${{ github.run_number }}"

      - name: Upgrade and rollback test
        if: matrix.test
        run: make upgrade

      - name: Signature test
        if: matrix.test
        run: make sig-test

      - name: Stop the VM
        if: always() && matrix.test
        run: make stop

      - name: Upload logs
        if: always() && matrix.test
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qemu-logs-${{ matrix.arch }}
          path: |
            out/logs/
            out/serial.log
          if-no-files-found: ignore

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Sign and push to ghcr.io
        if: github.event_name != 'pull_request'
        env:
          REGISTRY_FROM_HOST: ${{ env.GHCR }}
          IMAGE_TAG: latest${{ matrix.suffix }}
        run: make push
