name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The push goes to ghcr.io/OWNER/azurelinux-bootc:latest.
      REGISTRY_FROM_HOST: ghcr.io/${{ github.repository_owner }}
      IMAGE_TAG: latest
    steps:
      - uses: actions/checkout@v4

      - name: Install podman and skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y podman skopeo
          podman --version
          skopeo --version

      - name: Signing key
        # With the three secrets set, every build signs with the same key and the public key in
        # the image matches. Without them the run makes a throwaway key, so the image is signed
        # but no machine can verify it against a known key.
        env:
          SIGSTORE_PRIVATE_KEY: ${{ secrets.SIGSTORE_PRIVATE_KEY }}
          SIGSTORE_PASSPHRASE: ${{ secrets.SIGSTORE_PASSPHRASE }}
          SIGSTORE_PUBLIC_KEY: ${{ secrets.SIGSTORE_PUBLIC_KEY }}
        run: |
          if [ -n "$SIGSTORE_PRIVATE_KEY" ]; then
            mkdir -p out/keys config/etc/pki/containers
            umask 077
            printf '%s\n' "$SIGSTORE_PRIVATE_KEY" > out/keys/azurelinux-bootc.private
            printf '%s' "$SIGSTORE_PASSPHRASE" > out/keys/passphrase
            umask 022
            printf '%s\n' "$SIGSTORE_PUBLIC_KEY" > config/etc/pki/containers/azurelinux-bootc.pub
            echo "using the signing key from secrets"
          else
            make keys
            echo "using a throwaway signing key"
          fi

      - name: Allow unprivileged user namespaces
        # Ubuntu 24.04 lets only binaries with an AppArmor profile create user namespaces.
        # podman has one, skopeo does not, and skopeo needs one to write the rootless image store.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build and chunk
        run: make build VERSION=${{ github.run_number }}

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Sign and push
        if: github.event_name != 'pull_request'
        run: make push
