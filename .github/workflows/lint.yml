name: lint

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: shellcheck -x -P SCRIPTDIR scripts/*.sh
      - name: Check for em-dashes
        run: |
          if grep -rIl $'\xe2\x80\x94' --exclude-dir=.git --exclude-dir=docs/research .; then
            echo "em-dash found"; exit 1
          fi
